<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h1>PS Builder Recorder</h1>
    <div id="status" class="status">Idle</div>
    <div id="event-count" class="meta"></div>
    <div class="buttons">
      <button id="start">Start recording</button>
      <button id="stop" disabled>Stop</button>
      <button id="export" disabled>Export recording</button>
    </div>
    <button id="reset" class="reset">Reset</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
